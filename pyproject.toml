[project]
name = "nids"
version = "0.1.0"
description = "CMP6202: multi-class network intrusion detection on CSE-CIC-IDS2018 (Wednesday 14-02-2018)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "imbalanced-learn>=0.12",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "notebook>=7.2",
    "pytest>=8.3",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nids"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
